<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion Admin</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins", sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#003399,#001f66);
}

/* CARD */
.login-container{
    width:100%;
    max-width:420px;
    padding:40px;
}

.login-card{
    background:white;
    border-radius:20px;
    padding:35px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    animation:fadeIn .6s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

/* TITLE */
.login-card h2{
    text-align:center;
    color:#003399;
    margin-bottom:8px;
}

.login-card p{
    text-align:center;
    font-size:14px;
    color:#6b7280;
    margin-bottom:25px;
}

/* INPUTS */
.input-group{
    margin-bottom:18px;
}

.input-group label{
    font-size:14px;
    font-weight:600;
    color:#003399;
    display:block;
    margin-bottom:6px;
}

.input-group input{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:2px solid #edf2f7;
    background:#f8fafc;
    outline:none;
    transition:.3s;
}

.input-group input:focus{
    border-color:#003399;
    background:white;
    box-shadow:0 0 0 4px rgba(0,51,153,.1);
}

/* BUTTON */
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#003399,#001f66);
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
    margin-top:10px;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(0,51,153,.3);
}

/* LOADING TEXT */
#loading{
    text-align:center;
    margin-top:15px;
    font-size:13px;
    color:#003399;
    display:none;
}

/* ERROR */
#error{
    text-align:center;
    margin-top:10px;
    color:#dc2626;
    font-size:13px;
    display:none;
}

.error-box{
    margin-top:15px;
    padding:12px 15px;

    border-radius:10px;

    font-size:14px;
    font-weight:500;

    display:none;

    background:#fee2e2;
    color:#b91c1c;

    border:1px solid #fecaca;
}

</style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h2>Administration</h2>
        <p>Connexion sécurisée</p>

        <form id="loginForm">

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="admin@email.com" required>
            </div>

            <div class="input-group">
                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit">Se connecter</button>

        </form>

        <div id="loading">Connexion en cours...</div>
        <div id="error" class="error-box"></div>

    </div>

</div>
<script type="module" src="login.js"></script>

</body>
</html>
